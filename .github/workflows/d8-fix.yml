name: D8 Fetch Fix
on: [workflow_dispatch, push]
jobs:
  fix-d8:
    runs-on: ubuntu-latest
    steps:
      - name: API-Driven D8 Fetch & Verify
        run: |
          set -ex
          mkdir -p out/x64.release
          
          # Consultar la API para obtener la URL de descarga directa del asset de Linux x64
          API_URL="https://api.github.com/repos/v8-binaries/v8-binaries/releases/latest"
          DOWNLOAD_URL=$(curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL" | grep "browser_download_url" | grep -i "linux" | head -n 1 | cut -d '"' -f 4)
          
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "[*] Falló v8-binaries, probando espejo alternativo Pexien..."
            API_URL="https://api.github.com/repos/Pexien/prebuilt-v8/releases/latest"
            DOWNLOAD_URL=$(curl -sSL "$API_URL" | grep "browser_download_url" | grep -i "linux" | head -n 1 | cut -d '"' -f 4)
          fi
          
          echo "[+] URL resuelta por API: $DOWNLOAD_URL"
          curl -sL "$DOWNLOAD_URL" -o out/x64.release/d8.zip
          
          if ! head -c 2 out/x64.release/d8.zip | grep -q "PK"; then
            echo "[!] FATAL: El archivo descargado no es un ZIP válido. Contenido recibido:"
            cat out/x64.release/d8.zip
            exit 1
          fi
          
          unzip -qo out/x64.release/d8.zip -d out/x64.release/
          chmod +x out/x64.release/d8
          ./out/x64.release/d8 --version
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
