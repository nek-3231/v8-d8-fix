name: D8 Fetch Fix
on: [workflow_dispatch, push]
jobs:
  fix-d8:
    runs-on: ubuntu-latest
    steps:
      - name: Multi-Mirror D8 Fetch & Verify
        run: |
          set -ex
          mkdir -p out/x64.release
          
          # Espejos de respaldo para d8 x64
          URLS=(
            "https://github.com/Pexien/prebuilt-v8/releases/latest/download/d8-linux64.zip"
            "https://github.com/v8-binaries/v8-binaries/releases/latest/download/d8-linux64.zip"
          )
          
          SUCCESS=0
          for url in "${URLS[@]}"; do
            echo "[*] Probando espejo: $url"
            curl -sL "$url" -o out/x64.release/d8.zip || continue
            
            if head -c 2 out/x64.release/d8.zip | grep -q "PK"; then
              echo "[+] ¡Binario comprimido válido (PK) obtenido con éxito!"
              SUCCESS=1
              break
            else
              echo "[-] Espejo devolvió basura HTML (404/Redirect), rotando..."
            fi
          done
          
          if [ $SUCCESS -eq 0 ]; then
            echo "[!] FATAL: Ningún espejo soltó un zip válido. Dump del último fallo:"
            cat out/x64.release/d8.zip
            exit 1
          fi
          
          unzip -qo out/x64.release/d8.zip -d out/x64.release/
          chmod +x out/x64.release/d8
          ./out/x64.release/d8 --version
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
